spring.application.name=Projeto1

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evidências: o banco guarda apenas a referência e os metadados do arquivo.
# Uma implementação S3/MinIO pode substituir o bean EvidenciaStorage.
app.evidencias.storage=${APP_EVIDENCIAS_STORAGE:local}
app.evidencias.diretorio=${APP_EVIDENCIAS_DIRETORIO:./data/evidencias}
app.evidencias.tamanho-maximo=${APP_EVIDENCIAS_TAMANHO_MAXIMO:2MB}
app.notas-fiscais.xml.tamanho-maximo=${APP_NFE_XML_TAMANHO_MAXIMO:2MB}
spring.servlet.multipart.max-file-size=${APP_EVIDENCIAS_TAMANHO_MAXIMO:2MB}
spring.servlet.multipart.max-request-size=${APP_EVIDENCIAS_TAMANHO_MAXIMO:2MB}




# Configurar o flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
